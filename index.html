<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#FBFBF9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<title>PULSO — Reproductor de beats</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
  :root{
    --bg:#FBFBF9;
    --ink:#111113;
    --dim:#A8A6A0;
    --faint:#DDD9D2;
    --line:#ECEAE5;
  }
  body.dark{
    --bg:#050506;
    --ink:#F2EFEA;
    --dim:#6E6C75;
    --faint:#2E2E33;
    --line:#1A1A1F;
  }
  body.dark #sheet, body.dark #cfg,
  body.dark #sheet .sheet-head, body.dark #cfg .sheet-head{
    background:rgba(12,12,15,.98);
  }
  body.dark #toast{ background:rgba(20,20,24,.97); box-shadow:0 6px 24px rgba(0,0,0,.4); }
  body.dark .seg button.on{ background:#F2EFEA; color:#050506; }
  body.dark .cfg-row input[type="range"]{ accent-color:#F2EFEA; }
  body.dark #trackList li:hover{ background:rgba(255,255,255,.05); }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow:hidden;
    position:fixed; inset:0;
    touch-action:none;
    user-select:none; -webkit-user-select:none;
  }
  canvas#cv{ position:fixed; inset:0; width:100%; height:100%; display:block; background:var(--bg); }

  /* ---------- lo único siempre visible: miniatura + contador ---------- */
  #hud{
    position:fixed; top:0; left:0; right:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding-top:calc(env(safe-area-inset-top, 0px) + 22px);
    pointer-events:none;
  }
  #thumb{
    width:170px; height:36px; display:block;
    pointer-events:auto; cursor:pointer;
  }
  #time{
    font-family:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric:tabular-nums;
    font-size:11px; color:var(--dim); letter-spacing:.08em;
  }
  #handle{
    font-size:10px; color:var(--dim); letter-spacing:.28em; text-indent:.28em;
    opacity:.85;
  }
  #tname{
    font-family:ui-monospace, "SF Mono", SFMono-Regular, Menlo, "Courier New", monospace;
    font-size:11px; color:var(--ink); letter-spacing:.12em;
    max-width:80vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-align:center;
  }
  #tname:empty{ display:none; }

  /* ---------- controles: se desvanecen mientras suena ---------- */
  footer{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    display:flex; align-items:center; justify-content:center; gap:30px;
    padding:14px 18px calc(env(safe-area-inset-bottom, 0px) + 24px);
    transition:opacity .6s ease;
  }
  body.zen footer{ opacity:.10; }
  .ctrl{
    appearance:none; border:none; background:transparent; color:var(--dim);
    width:44px; height:44px; border-radius:50%; cursor:pointer;
    display:grid; place-items:center;
    transition:color .2s ease, transform .1s ease;
  }
  .ctrl:hover, .ctrl:focus-visible{ color:var(--ink); }
  .ctrl:focus-visible{ outline:1px solid var(--dim); outline-offset:3px; }
  .ctrl:active{ transform:scale(.94); }
  .ctrl svg{ width:18px; height:18px; }
  #btnPlay{
    width:56px; height:56px; color:var(--ink);
    border:1px solid var(--faint);
  }
  #btnPlay svg{ width:20px; height:20px; }

  /* ---------- estado vacío ---------- */
  #empty{
    position:fixed; inset:0; z-index:4;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    cursor:pointer; text-align:center; padding:24px;
  }
  #empty .ring{
    width:64px; height:64px; border-radius:50%;
    border:1px solid var(--faint);
    display:grid; place-items:center;
    color:var(--dim);
    transition:border-color .3s ease, color .3s ease;
  }
  #empty:hover .ring{ border-color:var(--dim); color:var(--ink); }
  #empty .ring svg{ width:20px; height:20px; }
  #empty p{
    font-size:11px; color:var(--dim); letter-spacing:.32em; text-indent:.32em;
    text-transform:uppercase; line-height:2;
  }
  #empty.hidden{ display:none; }

  /* ---------- playlist ---------- */
  #sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:8;
    max-height:62vh; overflow-y:auto;
    background:rgba(255,255,255,.98);
    border-top:1px solid var(--line);
    box-shadow:0 -12px 40px rgba(20,20,18,.08);
    transform:translateY(105%);
    transition:transform .3s cubic-bezier(.32,.72,.28,1);
    padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
  }
  #sheet.open{ transform:translateY(0); }
  #sheet .sheet-head{
    position:sticky; top:0; background:rgba(255,255,255,.98);
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px 10px;
  }
  #sheet .sheet-head h2{
    font-size:10px; font-weight:700; letter-spacing:.34em; text-transform:uppercase; color:var(--dim);
  }
  .icon-btn{
    appearance:none; border:none; background:transparent; color:var(--dim);
    width:36px; height:36px; border-radius:50%;
    display:grid; place-items:center; cursor:pointer;
    transition:color .2s ease;
  }
  .icon-btn:hover, .icon-btn:focus-visible{ color:var(--ink); }
  .icon-btn:focus-visible{ outline:1px solid var(--dim); outline-offset:3px; }
  .icon-btn svg{ width:18px; height:18px; }
  #trackList{ list-style:none; }
  #trackList li{
    display:flex; align-items:center; gap:14px;
    padding:14px 22px; cursor:pointer;
    transition:background .15s ease;
  }
  #trackList li:hover{ background:rgba(0,0,0,.03); }
  #trackList .num{
    font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:10px; color:var(--dim); width:18px; text-align:right;
    font-variant-numeric:tabular-nums;
  }
  #trackList .tname{
    flex:1; min-width:0; font-size:13px; letter-spacing:.03em; color:var(--dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #trackList .tdur{
    font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:10px; color:var(--dim); font-variant-numeric:tabular-nums;
  }
  #trackList li.current .tname{ color:var(--ink); font-weight:600; }
  #trackList li.current .num{ color:var(--ink); }
  #scrim{
    position:fixed; inset:0; z-index:7; background:rgba(30,30,28,.25);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  #scrim.open{ opacity:1; pointer-events:auto; }

  /* ---------- configuración ---------- */
  #cfg{
    position:fixed; left:0; right:0; bottom:0; z-index:8;
    max-height:78vh; overflow-y:auto;
    background:rgba(255,255,255,.98);
    border-top:1px solid var(--line);
    box-shadow:0 -12px 40px rgba(20,20,18,.08);
    transform:translateY(105%);
    transition:transform .3s cubic-bezier(.32,.72,.28,1);
    padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 18px);
  }
  #cfg.open{ transform:translateY(0); }
  #cfg{ transition:transform .3s cubic-bezier(.32,.72,.28,1), opacity .25s ease; }
  body.tuning #cfg{ opacity:.14; }
  body.tuning #scrim{ opacity:0; }
  #cfg .sheet-head{
    position:sticky; top:0; background:rgba(255,255,255,.98);
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px 10px;
  }
  #cfg .sheet-head h2{
    font-size:10px; font-weight:700; letter-spacing:.34em; text-transform:uppercase; color:var(--dim);
  }
  .cfg-row{ padding:12px 22px 6px; }
  .cfg-row > label{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:10px; font-weight:600; letter-spacing:.18em; text-transform:uppercase;
    color:var(--dim); margin-bottom:10px;
  }
  .cfg-row > label b{
    font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:11px; color:var(--ink); font-weight:600; letter-spacing:0;
    font-variant-numeric:tabular-nums;
  }
  .cfg-row input[type="range"]{
    width:100%; height:28px; accent-color:#111113; touch-action:auto;
  }
  .seg{
    display:flex; gap:6px; border:1px solid var(--line); border-radius:99px; padding:4px;
  }
  .seg button{
    flex:1; appearance:none; border:none; background:transparent; cursor:pointer;
    font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
    color:var(--dim); padding:9px 0; border-radius:99px;
    transition:background .2s ease, color .2s ease;
  }
  .seg button.on{ background:#111113; color:#FBFBF9; }

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:130px; transform:translateX(-50%) translateY(16px);
    z-index:9; background:rgba(255,255,255,.97); border:1px solid var(--line);
    box-shadow:0 6px 24px rgba(20,20,18,.10);
    color:var(--ink); font-size:12px; letter-spacing:.04em;
    padding:9px 18px; border-radius:99px; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>

<canvas id="cv"></canvas>

<div id="hud">
  <div id="tname"></div>
  <canvas id="thumb"></canvas>
  <div id="time"></div>
  <div id="handle">@dantefckndavis</div>
</div>

<div id="empty">
  <div class="ring">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </div>
  <p>Toca para cargar<br>tus beats</p>
</div>

<footer>
  <button class="ctrl" id="btnPrev" aria-label="Anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 5v14M18 5l-9 7 9 7z"/>
    </svg>
  </button>
  <button class="ctrl" id="btnPlay" aria-label="Reproducir">
    <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px">
      <path d="M8 5v14l11-7z"/>
    </svg>
    <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none">
      <path d="M7 5h3.4v14H7zm6.6 0H17v14h-3.4z"/>
    </svg>
  </button>
  <button class="ctrl" id="btnNext" aria-label="Siguiente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 5v14M6 5l9 7-9 7z"/>
    </svg>
  </button>
  <button class="ctrl" id="btnAdd" aria-label="Agregar beats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>
  <button class="ctrl" id="btnSheet" aria-label="Abrir lista de beats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M4 7h16M4 12h16M4 17h9"/>
    </svg>
  </button>
  <button class="ctrl" id="btnCfg" aria-label="Configuración">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M4 8h10M18 8h2M4 16h2M10 16h10"/>
      <circle cx="16" cy="8" r="2.2"/>
      <circle cx="8" cy="16" r="2.2"/>
    </svg>
  </button>
</footer>

<div id="cfg">
  <div class="sheet-head">
    <h2>Configuración</h2>
    <button class="icon-btn" id="btnCloseCfg" aria-label="Cerrar configuración">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>
  <div class="cfg-row">
    <label>Visualizador</label>
    <div class="seg">
      <button id="segDots" type="button">Puntitos</button>
      <button id="segLine" type="button">Línea</button>
    </div>
  </div>
  <div class="cfg-row">
    <label>Tema</label>
    <div class="seg">
      <button id="segLight" type="button">Blanco</button>
      <button id="segDark" type="button">Negro</button>
    </div>
  </div>
  <div class="cfg-row">
    <label>Puntitos <b id="vN">45</b></label>
    <input type="range" id="rN" min="15" max="90" step="1">
  </div>
  <div class="cfg-row">
    <label>Grosor <b id="vWidth">2.4</b></label>
    <input type="range" id="rWidth" min="1" max="8" step="0.2">
  </div>
  <div class="cfg-row">
    <label>Altura máxima <b id="vMaxH">24%</b></label>
    <input type="range" id="rMaxH" min="8" max="45" step="1">
  </div>
  <div class="cfg-row">
    <label>Velocidad de reacción <b id="vSpeed">100%</b></label>
    <input type="range" id="rSpeed" min="30" max="200" step="5">
  </div>
  <div class="cfg-row">
    <label>Ancho de campana <b id="vBell">100%</b></label>
    <input type="range" id="rBell" min="50" max="200" step="5">
  </div>
  <div class="cfg-row">
    <label>Umbral de pico <b id="vThr">3%</b></label>
    <input type="range" id="rThr" min="1" max="30" step="1">
  </div>
</div>

<div id="scrim"></div>
<div id="sheet">
  <div class="sheet-head">
    <h2>Tus beats</h2>
    <button class="icon-btn" id="btnCloseSheet" aria-label="Cerrar lista">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>
  <ul id="trackList"></ul>
</div>

<div id="toast"></div>
<input type="file" id="filePick" multiple hidden>

<script>
(function(){
  'use strict';

  var PX_PER_SEC = 90;          // sensibilidad del arrastre para adelantar
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============ estado ============ */
  var tracks = [];              // {name, url, file, duration, peaks}
  var current = -1;
  var audio = null, actx = null, analyser = null, srcNode = null;
  var freqData = null, timeData = null;
  var playing = false;

  var scrubbing = false, scrubTime = 0;
  var bassHist = [], level = 0, amp = 0, bassSmooth = 0;
  var beatEnv = 0, lastBeatAt = 0;

  /* ============ configuración (persistente) ============ */
  var CFG = { mode:'dots', n:45, speed:1, bell:1, thr:0.03,
              theme:'light', width:2.4, maxH:24 };
  try{
    var saved = JSON.parse(localStorage.getItem('pulso-cfg') || '{}');
    for (var ck in CFG) if (saved[ck] !== undefined) CFG[ck] = saved[ck];
  }catch(e){}
  function saveCfg(){
    try{ localStorage.setItem('pulso-cfg', JSON.stringify(CFG)); }catch(e){}
  }

  var N_PTS, ys, bandV, envRaw, bells, bandNorm;
  function setN(n){
    N_PTS = n - 1;                            // n puntitos → índices 0..n-1
    ys = new Float32Array(N_PTS + 1);         // extensión de cada puntito
    bandV = new Float32Array(N_PTS + 1);      // envolvente suavizada
    envRaw = new Float32Array(N_PTS + 1);     // envolvente cruda
    bells = new Float32Array(N_PTS + 1);      // espectro en campanas
    bandNorm = new Float32Array(N_PTS + 1);   // máximo adaptativo por banda
  }
  setN(CFG.n);

  /* ============ DOM ============ */
  var cv = document.getElementById('cv');
  var g = cv.getContext('2d');
  var thumb = document.getElementById('thumb');
  var tg = thumb.getContext('2d');
  var elTime = document.getElementById('time');
  var elEmpty = document.getElementById('empty');
  var btnPlay = document.getElementById('btnPlay');
  var iconPlay = document.getElementById('iconPlay');
  var iconPause = document.getElementById('iconPause');
  var sheet = document.getElementById('sheet');
  var scrim = document.getElementById('scrim');
  var listEl = document.getElementById('trackList');
  var toastEl = document.getElementById('toast');
  var filePick = document.getElementById('filePick');

  var W = 0, H = 0, dpr = 1;
  var TW = 170, TH = 36;
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    thumb.width = Math.round(TW * dpr);
    thumb.height = Math.round(TH * dpr);
    tg.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  var toastTimer = 0;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
  }

  function fmt(s){
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  /* ============ audio ============ */
  function ensureAudio(){
    if (audio) return;
    audio = new Audio();
    audio.preload = 'auto';
    audio.addEventListener('ended', function(){
      if (current < tracks.length - 1) playTrack(current + 1);
      else setPlaying(false);
    });
    audio.addEventListener('loadedmetadata', function(){
      if (current >= 0){ tracks[current].duration = audio.duration; renderList(); }
    });
    audio.addEventListener('play',  function(){ setPlaying(true);  });
    audio.addEventListener('pause', function(){ setPlaying(false); });
    audio.addEventListener('error', function(){
      if (current >= 0) toast('No pude reproducir "' + tracks[current].name + '"');
    });
  }

  function ensureGraph(){
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    analyser = actx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.45;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.fftSize);
    srcNode = actx.createMediaElementSource(audio);
    srcNode.connect(analyser);
    analyser.connect(actx.destination);
  }

  function setPlaying(v){
    playing = v;
    iconPlay.style.display = v ? 'none' : '';
    iconPause.style.display = v ? '' : 'none';
    btnPlay.setAttribute('aria-label', v ? 'Pausar' : 'Reproducir');
    document.body.classList.toggle('zen', v);
    if ('mediaSession' in navigator){
      navigator.mediaSession.playbackState = v ? 'playing' : 'paused';
    }
  }

  /* miniatura: forma completa del loop, ~56 barras */
  var THUMB_BARS = 56;
  function computePeaks(track){
    track.file.arrayBuffer().then(function(buf){
      return actx.decodeAudioData(buf);
    }).then(function(ab){
      var chs = [];
      for (var c = 0; c < ab.numberOfChannels; c++) chs.push(ab.getChannelData(c));
      var win = Math.max(1, Math.floor(ab.length / THUMB_BARS));
      var peaks = new Float32Array(THUMB_BARS);
      var max = 0;
      for (var i = 0; i < THUMB_BARS; i++){
        var start = i * win, end = Math.min(start + win, ab.length);
        var sum = 0, cnt = 0;
        for (var s = start; s < end; s += 16){
          var v = 0;
          for (var c2 = 0; c2 < chs.length; c2++) v += chs[c2][s];
          v /= chs.length;
          sum += v * v; cnt++;
        }
        var rms = Math.sqrt(sum / Math.max(1, cnt));
        peaks[i] = rms;
        if (rms > max) max = rms;
      }
      if (max > 0) for (var j = 0; j < THUMB_BARS; j++) peaks[j] = Math.pow(peaks[j] / max, 0.8);
      track.peaks = peaks;
      if (!track.duration) track.duration = ab.duration;
      renderList();
    }).catch(function(){ /* la miniatura cae a una línea simple */ });
  }

  function playTrack(i){
    if (i < 0 || i >= tracks.length) return;
    ensureAudio();
    ensureGraph();
    current = i;
    var t = tracks[i];
    audio.src = t.url;
    document.getElementById('tname').textContent = t.name;
    if (!t.peaks) computePeaks(t);
    audio.play().catch(function(){ toast('Toca ▶ para reproducir'); });
    renderList();
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({ title: t.name, artist: 'PULSO' });
    }
  }

  function addFiles(fileList){
    var added = 0;
    for (var i = 0; i < fileList.length; i++){
      var f = fileList[i];
      var byType = f.type && (f.type.indexOf('audio') === 0 || f.type.indexOf('video') === 0);
      var byExt = /\.(mp3|wav|m4a|aac|ogg|oga|flac|opus|webm|aif|aiff|caf)$/i.test(f.name);
      var unknown = !f.type || f.type === 'application/octet-stream';
      if (!byType && !byExt && !unknown) continue;
      tracks.push({
        name: f.name.replace(/\.[^.]+$/, ''),
        url: URL.createObjectURL(f),
        file: f, duration: 0, peaks: null
      });
      added++;
    }
    if (!added){ toast('Esos archivos no parecen audio'); return; }
    elEmpty.classList.add('hidden');
    renderList();
    if (current === -1) playTrack(tracks.length - added);
    else toast(added + (added === 1 ? ' beat agregado' : ' beats agregados'));
  }

  /* ============ análisis ============ */
  function analyse(){
    if (!analyser || !playing){ level *= 0.94; return; }
    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);

    var bass = 0;
    for (var i = 2; i <= 14; i++) bass += freqData[i];
    bass /= 13;

    var sum = 0;
    for (var j = 0; j < timeData.length; j += 8){
      var v = (timeData[j] - 128) / 128;
      sum += v * v;
    }
    level += (Math.sqrt(sum / (timeData.length / 8)) - level) * 0.2;
    bassSmooth += (bass / 255 - bassSmooth) * 0.18;

    bassHist.push(bass);
    if (bassHist.length > 55) bassHist.shift();
    var avg = 0;
    for (var k = 0; k < bassHist.length; k++) avg += bassHist[k];
    avg /= Math.max(1, bassHist.length);

    var t = performance.now();
    if (bassHist.length > 20 && bass > 42 && bass > avg * 1.38 && t - lastBeatAt > 170){
      lastBeatAt = t;
      beatEnv = Math.min(1, 0.5 + (bass / Math.max(1, avg) - 1) * 0.8);
    }
  }

  /* ============ la onda ============
     Fila de puntitos sobre una línea recta: cada puntito es una banda de
     frecuencia (45 Hz izq → 4.2 kHz der). Cuando su frecuencia suena, el
     puntito se estira en una línea vertical (arriba y abajo) al instante
     y se encoge suave — un arp se ve como líneas saltando de puntito en
     puntito siguiendo la melodía. */
  var lastFrame = performance.now();

  function updateShape(){
    var binHz = (actx ? actx.sampleRate : 48000) / analyser.fftSize;
    var i, j;

    for (i = 0; i <= N_PTS; i++){
      var d = i / N_PTS;
      var f = 45 * Math.pow(4200 / 45, d);      // 45 Hz → 4.2 kHz (log)
      var bin = Math.max(1, Math.round(f / binHz));
      var m = (freqData[bin] + freqData[bin + 1] + freqData[bin + 2]) / (3 * 255);
      var v = Math.pow(m, 1.5) * (0.5 + d * 1.0);   // tilt suave
      // lógica de nivel: cada banda contra su propio máximo adaptativo,
      // con umbral más alto hacia los graves (el bajo siempre suena
      // fuerte en un beat instrumental)
      var bn = bandNorm[i];
      bn += (v > bn ? 0.3 : 0.012) * (v - bn);
      bandNorm[i] = bn;
      var rel = Math.min(1, v / Math.max(bn, 0.06));
      var thr = 0.38 + (1 - d) * 0.27;
      rel = (rel - thr) / (1 - thr);
      // sensibilidad al 80%: ni al máximo se llena el área
      envRaw[i] = rel <= 0 ? 0 : Math.pow(rel, 1.9) * 0.8;
    }

    // campanas en TODO el espectro: cada sonido se concentra en su pico.
    // Se detectan los máximos locales y el espectro se redibuja como
    // campanas de Gauss — más anchas en los graves (sonidos gruesos) y
    // cada vez más delgadas hacia arriba, con límite
    // un solo ajuste escala todo el rango: graves 1.6 → agudos 0.7, ×bell
    var sigL = 1.6 * CFG.bell, sigH = 0.7 * CFG.bell;
    for (i = 0; i <= N_PTS; i++) bells[i] = 0;
    for (i = 0; i <= N_PTS; i++){
      var e = envRaw[i];
      if (e < CFG.thr) continue;                    // umbral de pico
      var lft = i > 0 ? envRaw[i - 1] : 0;
      var rgt = i < N_PTS ? envRaw[i + 1] : 0;
      if (e < lft || e < rgt) continue;             // solo picos locales
      var dp = i / N_PTS;
      var sig = Math.max(sigH, sigL - dp * (sigL - sigH));
      var span = Math.ceil(sig * 3);
      for (j = Math.max(0, i - span); j <= Math.min(N_PTS, i + span); j++){
        var dd = j - i;
        var b = e * Math.exp(-(dd * dd) / (2 * sig * sig));
        if (b > bells[j]) bells[j] = b;
      }
    }
    for (i = 0; i <= N_PTS; i++) bandV[i] = bells[i];

    // extensión final: los graves reaccionan lentos y pesados, los altos
    // rápidos y ligeros — cada zona con la inercia de su sonido
    for (i = 0; i <= N_PTS; i++){
      var target = bandV[i];
      var dr = i / N_PTS;
      var rate = target > ys[i] ? (0.28 + dr * 0.30) : (0.11 + dr * 0.16);
      ys[i] += (target - ys[i]) * Math.min(0.95, rate * CFG.speed);
    }
  }

  function draw(){
    requestAnimationFrame(draw);
    var now = performance.now();
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    analyse();
    beatEnv *= Math.pow(0.03, dt);

    var target = playing ? Math.min(1, level * 1.4 + bassSmooth * 0.9) : 0;
    amp += (target - amp) * (playing ? 0.25 : 0.06);

    var dark = CFG.theme === 'dark';
    g.fillStyle = dark ? '#050506' : '#FBFBF9';
    g.fillRect(0, 0, W, H);

    if (playing && freqData) updateShape();
    else for (var k = 0; k <= N_PTS; k++) ys[k] *= 0.94;

    var midY = H / 2;
    var slot = W / (N_PTS + 1);
    var active = amp > 0.015;
    // área de movimiento: altura máxima configurable
    var scale = H * (CFG.maxH / 100) * (0.3 + amp * 0.7) * (1 + beatEnv * 0.10);
    var baseLen = 0.6;
    g.strokeStyle = active ? (dark ? '#FFFFFF' : '#000000')
                           : (dark ? '#2E2E33' : '#DDD9D2');
    g.lineWidth = CFG.width;
    g.lineCap = 'round';

    if (CFG.mode === 'line'){
      // una sola línea suave que dibuja la silueta de las campanas
      g.lineJoin = 'round';
      g.beginPath();
      var lx0 = 0.5 * slot, ly0 = midY - (active ? ys[0] * scale : 0);
      g.moveTo(lx0, ly0);
      for (var i = 1; i <= N_PTS; i++){
        var lx = (i + 0.5) * slot;
        var ly = midY - (active ? ys[i] * scale : 0);
        g.quadraticCurveTo(lx0, ly0, (lx0 + lx) / 2, (ly0 + ly) / 2);
        lx0 = lx; ly0 = ly;
      }
      g.lineTo(lx0, ly0);
      g.stroke();
    } else {
      // puntitos: cada uno se estira en línea vertical con su frecuencia
      g.beginPath();
      for (var i2 = 0; i2 <= N_PTS; i2++){
        var x = (i2 + 0.5) * slot;
        var len = active ? Math.max(baseLen, ys[i2] * scale) : baseLen;
        g.moveTo(x, midY - len);
        g.lineTo(x, midY + len);
      }
      g.stroke();
    }

    drawThumb();

    if (audio && current >= 0){
      var t = scrubbing ? scrubTime : audio.currentTime;
      elTime.textContent = fmt(t) + ' / ' + fmt(audio.duration);
    } else {
      elTime.textContent = '';
    }
  }

  function drawThumb(){
    tg.clearRect(0, 0, TW, TH);
    if (current < 0){ return; }
    var track = tracks[current];
    var dur = audio && isFinite(audio.duration) ? audio.duration : 0;
    var t = scrubbing ? scrubTime : (audio ? audio.currentTime : 0);
    var frac = dur > 0 ? Math.max(0, Math.min(1, t / dur)) : 0;

    var dk = CFG.theme === 'dark';
    var cPlay = dk ? '#FFFFFF' : '#000000';
    var cRest = dk ? '#3A3A40' : '#DDD9D2';
    if (track.peaks){
      var bw = TW / THUMB_BARS;
      var mid = TH / 2;
      for (var i = 0; i < THUMB_BARS; i++){
        var h = Math.max(1.5, track.peaks[i] * (TH * 0.46));
        tg.fillStyle = (i + 0.5) / THUMB_BARS <= frac ? cPlay : cRest;
        tg.fillRect(i * bw + bw * 0.22, mid - h, bw * 0.56, h * 2);
      }
    } else {
      tg.fillStyle = cRest;
      tg.fillRect(0, TH / 2 - 0.75, TW, 1.5);
      tg.fillStyle = cPlay;
      tg.fillRect(frac * (TW - 3), TH / 2 - 4, 3, 8);
    }
  }
  requestAnimationFrame(draw);

  /* ============ interacción ============ */
  var pDown = false, pStartX = 0, pStartT = 0, dragged = false;

  cv.addEventListener('pointerdown', function(e){
    if (current < 0) { openPicker(); return; }
    pDown = true; dragged = false;
    pStartX = e.clientX;
    pStartT = audio.currentTime;
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', function(e){
    if (!pDown) return;
    var dx = e.clientX - pStartX;
    if (!dragged && Math.abs(dx) > 8){ dragged = true; scrubbing = true; }
    if (dragged){
      var d = audio && isFinite(audio.duration) ? audio.duration : Infinity;
      scrubTime = Math.max(0, Math.min(d, pStartT + dx / PX_PER_SEC * 5));
    }
  });
  cv.addEventListener('pointerup', function(){
    if (!pDown) return;
    pDown = false;
    if (dragged){ audio.currentTime = scrubTime; scrubbing = false; }
    else togglePlay();
  });
  cv.addEventListener('pointercancel', function(){ pDown = false; scrubbing = false; });

  // miniatura = barra de progreso interactiva
  var tDown = false;
  function thumbSeek(clientX){
    if (!audio || !isFinite(audio.duration)) return;
    var r = thumb.getBoundingClientRect();
    var frac = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    audio.currentTime = frac * audio.duration;
  }
  thumb.addEventListener('pointerdown', function(e){
    tDown = true; thumb.setPointerCapture(e.pointerId); thumbSeek(e.clientX);
  });
  thumb.addEventListener('pointermove', function(e){ if (tDown) thumbSeek(e.clientX); });
  thumb.addEventListener('pointerup', function(){ tDown = false; });
  thumb.addEventListener('pointercancel', function(){ tDown = false; });

  function togglePlay(){
    if (!audio || current < 0) return;
    ensureGraph();
    if (audio.paused) audio.play().catch(function(){});
    else audio.pause();
  }

  /* ============ controles ============ */
  function openPicker(){ filePick.click(); }

  document.getElementById('btnAdd').addEventListener('click', openPicker);
  elEmpty.addEventListener('click', openPicker);
  filePick.addEventListener('change', function(){
    if (filePick.files && filePick.files.length) addFiles(filePick.files);
    filePick.value = '';
  });

  btnPlay.addEventListener('click', togglePlay);
  document.getElementById('btnPrev').addEventListener('click', function(){
    if (current < 0) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    if (current > 0) playTrack(current - 1); else audio.currentTime = 0;
  });
  document.getElementById('btnNext').addEventListener('click', function(){
    if (current < tracks.length - 1) playTrack(current + 1);
  });

  document.getElementById('btnSheet').addEventListener('click', function(){
    sheet.classList.add('open'); scrim.classList.add('open');
  });
  function closeSheet(){
    sheet.classList.remove('open');
    cfgEl.classList.remove('open');
    scrim.classList.remove('open');
  }
  document.getElementById('btnCloseSheet').addEventListener('click', closeSheet);
  scrim.addEventListener('click', closeSheet);

  /* ============ configuración: sliders ============ */
  var cfgEl = document.getElementById('cfg');
  var segDots = document.getElementById('segDots');
  var segLine = document.getElementById('segLine');
  var segLight = document.getElementById('segLight');
  var segDark = document.getElementById('segDark');
  var rWidth = document.getElementById('rWidth'), vWidth = document.getElementById('vWidth');
  var rMaxH = document.getElementById('rMaxH'), vMaxH = document.getElementById('vMaxH');
  var rN = document.getElementById('rN'),       vN = document.getElementById('vN');
  var rSpeed = document.getElementById('rSpeed'), vSpeed = document.getElementById('vSpeed');
  var rBell = document.getElementById('rBell'), vBell = document.getElementById('vBell');
  var rThr = document.getElementById('rThr'),   vThr = document.getElementById('vThr');

  function applyTheme(){
    document.body.classList.toggle('dark', CFG.theme === 'dark');
    var mt = document.querySelector('meta[name="theme-color"]');
    if (!mt){
      mt = document.createElement('meta');
      mt.setAttribute('name', 'theme-color');
      document.head.appendChild(mt);
    }
    mt.setAttribute('content', CFG.theme === 'dark' ? '#050506' : '#FBFBF9');
  }
  applyTheme();

  function syncCfgUI(){
    segDots.classList.toggle('on', CFG.mode === 'dots');
    segLine.classList.toggle('on', CFG.mode === 'line');
    segLight.classList.toggle('on', CFG.theme !== 'dark');
    segDark.classList.toggle('on', CFG.theme === 'dark');
    rWidth.value = CFG.width;       vWidth.textContent = CFG.width.toFixed(1);
    rMaxH.value = CFG.maxH;         vMaxH.textContent = CFG.maxH + '%';
    rN.value = CFG.n;               vN.textContent = CFG.n;
    rSpeed.value = Math.round(CFG.speed * 100); vSpeed.textContent = Math.round(CFG.speed * 100) + '%';
    rBell.value = Math.round(CFG.bell * 100); vBell.textContent = Math.round(CFG.bell * 100) + '%';
    rThr.value = Math.round(CFG.thr * 100);     vThr.textContent = Math.round(CFG.thr * 100) + '%';
  }
  syncCfgUI();

  document.getElementById('btnCfg').addEventListener('click', function(){
    cfgEl.classList.add('open'); scrim.classList.add('open');
  });
  document.getElementById('btnCloseCfg').addEventListener('click', closeSheet);

  segDots.addEventListener('click', function(){ CFG.mode = 'dots'; saveCfg(); syncCfgUI(); });
  segLine.addEventListener('click', function(){ CFG.mode = 'line'; saveCfg(); syncCfgUI(); });
  segLight.addEventListener('click', function(){ CFG.theme = 'light'; saveCfg(); applyTheme(); syncCfgUI(); });
  segDark.addEventListener('click', function(){ CFG.theme = 'dark'; saveCfg(); applyTheme(); syncCfgUI(); });
  rWidth.addEventListener('input', function(){
    CFG.width = parseFloat(rWidth.value); saveCfg();
    vWidth.textContent = CFG.width.toFixed(1);
  });
  rMaxH.addEventListener('input', function(){
    CFG.maxH = parseInt(rMaxH.value, 10); saveCfg();
    vMaxH.textContent = CFG.maxH + '%';
  });
  rN.addEventListener('input', function(){
    CFG.n = parseInt(rN.value, 10); setN(CFG.n); saveCfg();
    vN.textContent = CFG.n;
  });
  rSpeed.addEventListener('input', function(){
    CFG.speed = parseInt(rSpeed.value, 10) / 100; saveCfg();
    vSpeed.textContent = rSpeed.value + '%';
  });
  rBell.addEventListener('input', function(){
    CFG.bell = parseInt(rBell.value, 10) / 100; saveCfg();
    vBell.textContent = rBell.value + '%';
  });
  rThr.addEventListener('input', function(){
    CFG.thr = parseInt(rThr.value, 10) / 100; saveCfg();
    vThr.textContent = rThr.value + '%';
  });

  // mientras arrastras un slider, el menú se vuelve transparente para ver
  // el visualizador moviéndose detrás
  [rN, rSpeed, rBell, rThr, rWidth, rMaxH].forEach(function(inp){
    inp.addEventListener('pointerdown', function(){
      document.body.classList.add('tuning');
    });
    ['pointerup', 'pointercancel'].forEach(function(ev){
      inp.addEventListener(ev, function(){
        document.body.classList.remove('tuning');
      });
    });
  });

  function renderList(){
    listEl.innerHTML = '';
    tracks.forEach(function(t, i){
      var li = document.createElement('li');
      if (i === current) li.className = 'current';
      var num = document.createElement('span');
      num.className = 'num'; num.textContent = i + 1;
      var nm = document.createElement('span');
      nm.className = 'tname'; nm.textContent = t.name;
      var du = document.createElement('span');
      du.className = 'tdur'; du.textContent = t.duration ? fmt(t.duration) : '···';
      li.appendChild(num); li.appendChild(nm); li.appendChild(du);
      li.addEventListener('click', function(){ playTrack(i); closeSheet(); });
      listEl.appendChild(li);
    });
  }

  /* ============ arrastrar y soltar (escritorio) ============ */
  document.addEventListener('dragover', function(e){ e.preventDefault(); });
  document.addEventListener('drop', function(e){
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  /* ============ media session ============ */
  if ('mediaSession' in navigator){
    try{
      navigator.mediaSession.setActionHandler('play',  function(){ if (audio) audio.play(); });
      navigator.mediaSession.setActionHandler('pause', function(){ if (audio) audio.pause(); });
      navigator.mediaSession.setActionHandler('previoustrack', function(){
        if (current > 0) playTrack(current - 1);
      });
      navigator.mediaSession.setActionHandler('nexttrack', function(){
        if (current < tracks.length - 1) playTrack(current + 1);
      });
    }catch(e){}
  }

  /* ============ teclado (escritorio) ============ */
  document.addEventListener('keydown', function(e){
    if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight' && audio) audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
    if (e.code === 'ArrowLeft'  && audio) audio.currentTime = Math.max(0, audio.currentTime - 5);
  });
})();
</script>
</body>
