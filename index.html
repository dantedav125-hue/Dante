<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#050506">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<title>PULSO — Reproductor de beats</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
  :root{
    --bg:#050506;
    --ink:#F2EFEA;
    --dim:#5C5A63;
    --faint:#2A2A30;
    --line:#17171B;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow:hidden;
    position:fixed; inset:0;
    touch-action:none;
    user-select:none; -webkit-user-select:none;
  }
  canvas#cv{ position:fixed; inset:0; width:100%; height:100%; display:block; background:var(--bg); }

  /* ---------- header ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:5;
    display:flex; align-items:center; gap:12px;
    padding:calc(env(safe-area-inset-top, 0px) + 18px) 22px 12px;
    pointer-events:none;
  }
  header > *{ pointer-events:auto; }
  .brand{
    font-size:10px; font-weight:700; letter-spacing:.5em; text-indent:.5em;
    color:var(--dim);
  }
  .track-info{ flex:1; min-width:0; text-align:center; }
  #trackName{
    font-size:11px; font-weight:500; letter-spacing:.18em; text-transform:uppercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    color:var(--ink);
  }
  #time{
    font-family:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric:tabular-nums;
    font-size:10px; color:var(--dim); margin-top:4px; letter-spacing:.08em;
  }
  .icon-btn{
    appearance:none; border:none; background:transparent; color:var(--dim);
    width:36px; height:36px; border-radius:50%;
    display:grid; place-items:center; cursor:pointer;
    transition:color .2s ease;
  }
  .icon-btn:hover, .icon-btn:focus-visible{ color:var(--ink); }
  .icon-btn:focus-visible{ outline:1px solid var(--dim); outline-offset:3px; }
  .icon-btn svg{ width:18px; height:18px; }

  /* ---------- estado vacío ---------- */
  #empty{
    position:fixed; inset:0; z-index:4;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    cursor:pointer; text-align:center; padding:24px;
  }
  #empty .ring{
    width:64px; height:64px; border-radius:50%;
    border:1px solid var(--faint);
    display:grid; place-items:center;
    color:var(--dim);
    transition:border-color .3s ease, color .3s ease;
  }
  #empty:hover .ring{ border-color:var(--dim); color:var(--ink); }
  #empty .ring svg{ width:20px; height:20px; }
  #empty p{
    font-size:11px; color:var(--dim); letter-spacing:.32em; text-indent:.32em;
    text-transform:uppercase; line-height:2;
  }
  #empty.hidden{ display:none; }

  /* ---------- progreso ---------- */
  #seek{
    position:fixed; left:0; right:0; z-index:6;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 108px);
    height:28px; cursor:pointer;
    display:none;
  }
  #seek.on{ display:block; }
  #seek .rail{
    position:absolute; left:22px; right:22px; top:50%; height:1px;
    background:var(--faint);
  }
  #seek .fill{
    position:absolute; left:22px; top:50%; height:1px; width:0;
    background:var(--ink);
  }

  /* ---------- dock inferior ---------- */
  footer{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    display:flex; align-items:center; justify-content:center; gap:34px;
    padding:14px 18px calc(env(safe-area-inset-bottom, 0px) + 26px);
  }
  .ctrl{
    appearance:none; border:none; background:transparent; color:var(--dim);
    width:44px; height:44px; border-radius:50%; cursor:pointer;
    display:grid; place-items:center;
    transition:color .2s ease, transform .1s ease;
  }
  .ctrl:hover, .ctrl:focus-visible{ color:var(--ink); }
  .ctrl:focus-visible{ outline:1px solid var(--dim); outline-offset:3px; }
  .ctrl:active{ transform:scale(.94); }
  .ctrl svg{ width:18px; height:18px; }
  #btnPlay{
    width:58px; height:58px; color:var(--ink);
    border:1px solid var(--faint);
    transition:border-color .25s ease, box-shadow .25s ease, transform .1s ease;
  }
  #btnPlay.beat{
    border-color:rgba(242,239,234,.5);
    box-shadow:0 0 22px rgba(242,239,234,.12);
  }
  #btnPlay svg{ width:20px; height:20px; }

  /* ---------- playlist ---------- */
  #sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:8;
    max-height:62vh; overflow-y:auto;
    background:rgba(9,9,11,.97);
    border-top:1px solid var(--line);
    transform:translateY(105%);
    transition:transform .3s cubic-bezier(.32,.72,.28,1);
    padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
  }
  #sheet.open{ transform:translateY(0); }
  #sheet .sheet-head{
    position:sticky; top:0; background:rgba(9,9,11,.97);
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px 10px;
  }
  #sheet .sheet-head h2{
    font-size:10px; font-weight:700; letter-spacing:.34em; text-transform:uppercase; color:var(--dim);
  }
  #trackList{ list-style:none; }
  #trackList li{
    display:flex; align-items:center; gap:14px;
    padding:14px 22px; cursor:pointer;
    transition:background .15s ease;
  }
  #trackList li:hover{ background:rgba(255,255,255,.03); }
  #trackList .num{
    font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:10px; color:var(--dim); width:18px; text-align:right;
    font-variant-numeric:tabular-nums;
  }
  #trackList .tname{
    flex:1; min-width:0; font-size:13px; letter-spacing:.03em; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #trackList .tdur{
    font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:10px; color:var(--dim); font-variant-numeric:tabular-nums;
  }
  #trackList li.current .tname{ color:var(--ink); font-weight:600; }
  #trackList li.current .num{ color:var(--ink); }
  #trackList li:not(.current) .tname{ color:var(--dim); }
  #scrim{
    position:fixed; inset:0; z-index:7; background:rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  #scrim.open{ opacity:1; pointer-events:auto; }

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:150px; transform:translateX(-50%) translateY(16px);
    z-index:9; background:rgba(16,16,19,.95); border:1px solid var(--line);
    color:var(--ink); font-size:12px; letter-spacing:.04em;
    padding:9px 18px; border-radius:99px; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>

<canvas id="cv"></canvas>

<header>
  <div class="brand">PULSO</div>
  <div class="track-info">
    <div id="trackName"></div>
    <div id="time"></div>
  </div>
  <button class="icon-btn" id="btnSheet" aria-label="Abrir lista de beats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M4 7h16M4 12h16M4 17h9"/>
    </svg>
  </button>
</header>

<div id="empty">
  <div class="ring">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </div>
  <p>Toca para cargar<br>tus beats</p>
</div>

<div id="seek">
  <div class="rail"></div>
  <div class="fill" id="seekFill"></div>
</div>

<footer>
  <button class="ctrl" id="btnPrev" aria-label="Anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 5v14M18 5l-9 7 9 7z"/>
    </svg>
  </button>
  <button class="ctrl" id="btnPlay" aria-label="Reproducir">
    <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px">
      <path d="M8 5v14l11-7z"/>
    </svg>
    <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none">
      <path d="M7 5h3.4v14H7zm6.6 0H17v14h-3.4z"/>
    </svg>
  </button>
  <button class="ctrl" id="btnNext" aria-label="Siguiente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 5v14M6 5l9 7-9 7z"/>
    </svg>
  </button>
  <button class="ctrl" id="btnAdd" aria-label="Agregar beats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>
</footer>

<div id="scrim"></div>
<div id="sheet">
  <div class="sheet-head">
    <h2>Tus beats</h2>
    <button class="icon-btn" id="btnCloseSheet" aria-label="Cerrar lista">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>
  <ul id="trackList"></ul>
</div>

<div id="toast"></div>
<input type="file" id="filePick" multiple hidden>

<script>
(function(){
  'use strict';

  var PX_PER_SEC = 90;          // sensibilidad del arrastre para adelantar/regresar
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============ estado ============ */
  var tracks = [];              // {name, url, file, duration}
  var current = -1;
  var audio = null, actx = null, analyser = null, srcNode = null;
  var freqData = null, timeData = null;
  var playing = false;

  var scrubbing = false, scrubTime = 0;
  var bassHist = [], level = 0, amp = 0, bassSmooth = 0;
  var beatEnv = 0, lastBeatAt = 0;

  var N_PTS = 160;                          // puntos de la curva
  var ys = new Float32Array(N_PTS + 1);     // forma suavizada entre cuadros
  var bandV = new Float32Array(N_PTS + 1);    // envolvente suavizada
  var envRaw = new Float32Array(N_PTS + 1);   // envolvente cruda
  var bandNorm = new Float32Array(N_PTS + 1); // máximo adaptativo por banda

  /* ============ DOM ============ */
  var cv = document.getElementById('cv');
  var g = cv.getContext('2d');
  var elName = document.getElementById('trackName');
  var elTime = document.getElementById('time');
  var elEmpty = document.getElementById('empty');
  var btnPlay = document.getElementById('btnPlay');
  var iconPlay = document.getElementById('iconPlay');
  var iconPause = document.getElementById('iconPause');
  var seekEl = document.getElementById('seek');
  var seekFill = document.getElementById('seekFill');
  var sheet = document.getElementById('sheet');
  var scrim = document.getElementById('scrim');
  var listEl = document.getElementById('trackList');
  var toastEl = document.getElementById('toast');
  var filePick = document.getElementById('filePick');

  var W = 0, H = 0, dpr = 1;
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  var toastTimer = 0;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
  }

  function fmt(s){
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  /* ============ audio ============ */
  function ensureAudio(){
    if (audio) return;
    audio = new Audio();
    audio.preload = 'auto';
    audio.addEventListener('ended', function(){
      if (current < tracks.length - 1) playTrack(current + 1);
      else setPlaying(false);
    });
    audio.addEventListener('loadedmetadata', function(){
      if (current >= 0){ tracks[current].duration = audio.duration; renderList(); }
    });
    audio.addEventListener('play',  function(){ setPlaying(true);  });
    audio.addEventListener('pause', function(){ setPlaying(false); });
    audio.addEventListener('error', function(){
      if (current >= 0) toast('No pude reproducir "' + tracks[current].name + '"');
    });
  }

  function ensureGraph(){
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    analyser = actx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.4;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.fftSize);
    srcNode = actx.createMediaElementSource(audio);
    srcNode.connect(analyser);
    analyser.connect(actx.destination);
  }

  function setPlaying(v){
    playing = v;
    iconPlay.style.display = v ? 'none' : '';
    iconPause.style.display = v ? '' : 'none';
    btnPlay.setAttribute('aria-label', v ? 'Pausar' : 'Reproducir');
    if ('mediaSession' in navigator){
      navigator.mediaSession.playbackState = v ? 'playing' : 'paused';
    }
  }

  function playTrack(i){
    if (i < 0 || i >= tracks.length) return;
    ensureAudio();
    ensureGraph();
    current = i;
    var t = tracks[i];
    audio.src = t.url;
    elName.textContent = t.name;
    seekEl.classList.add('on');
    audio.play().catch(function(){ toast('Toca ▶ para reproducir'); });
    renderList();
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({ title: t.name, artist: 'PULSO' });
    }
  }

  function addFiles(fileList){
    var added = 0;
    for (var i = 0; i < fileList.length; i++){
      var f = fileList[i];
      var byType = f.type && (f.type.indexOf('audio') === 0 || f.type.indexOf('video') === 0);
      var byExt = /\.(mp3|wav|m4a|aac|ogg|oga|flac|opus|webm|aif|aiff|caf)$/i.test(f.name);
      var unknown = !f.type || f.type === 'application/octet-stream';
      if (!byType && !byExt && !unknown) continue;
      tracks.push({
        name: f.name.replace(/\.[^.]+$/, ''),
        url: URL.createObjectURL(f),
        file: f, duration: 0
      });
      added++;
    }
    if (!added){ toast('Esos archivos no parecen audio'); return; }
    elEmpty.classList.add('hidden');
    renderList();
    if (current === -1) playTrack(tracks.length - added);
    else toast(added + (added === 1 ? ' beat agregado' : ' beats agregados'));
  }

  /* ============ detección de beat ============ */
  function analyse(){
    if (!analyser || !playing){ level *= 0.94; return; }
    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);

    var bass = 0;
    for (var i = 2; i <= 14; i++) bass += freqData[i];
    bass /= 13;

    var sum = 0;
    for (var j = 0; j < timeData.length; j += 8){
      var v = (timeData[j] - 128) / 128;
      sum += v * v;
    }
    level += (Math.sqrt(sum / (timeData.length / 8)) - level) * 0.2;
    bassSmooth += (bass / 255 - bassSmooth) * 0.18;

    bassHist.push(bass);
    if (bassHist.length > 55) bassHist.shift();
    var avg = 0;
    for (var k = 0; k < bassHist.length; k++) avg += bassHist[k];
    avg /= Math.max(1, bassHist.length);

    var t = performance.now();
    if (bassHist.length > 20 && bass > 42 && bass > avg * 1.38 && t - lastBeatAt > 170){
      lastBeatAt = t;
      beatEnv = Math.min(1, 0.5 + (bass / Math.max(1, avg) - 1) * 0.8);
      btnPlay.classList.add('beat');
      setTimeout(function(){ btnPlay.classList.remove('beat'); }, 160);
    }
  }

  /* ============ render: una sola línea, espectro de izquierda a derecha ====
     La línea es un ecualizador continuo: izquierda = graves (kick/808),
     centro = medios (voces, melodía), derecha = agudos (hats). La altura de
     cada zona sigue el volumen de su banda, con una ola que le da fluidez. */
  var lastFrame = performance.now();
  var phase = 0, phaseF = 0;   // ola lenta (graves) y ola rápida (agudos)

  function updateShape(){
    var binHz = (actx ? actx.sampleRate : 48000) / analyser.fftSize;
    var i, j;

    // 1) volumen de cada banda, normalizado contra SU PROPIO máximo
    //    adaptativo: el bajo se mide contra el bajo, los hats contra los
    //    hats — todas las zonas alcanzan alturas comparables
    for (i = 0; i <= N_PTS; i++){
      var d = i / N_PTS;
      var f = 40 * Math.pow(300, d);
      var bin = Math.max(1, Math.round(f / binHz));
      var m = (freqData[bin] + freqData[bin + 1] + freqData[bin + 2]) / (3 * 255);
      var v = Math.pow(m, 1.6) * (0.12 + Math.pow(d, 1.3) * 3.6);
      var bn = bandNorm[i];
      bn += (v > bn ? 0.35 : 0.015) * (v - bn);
      bandNorm[i] = bn;
      envRaw[i] = Math.pow(Math.min(1, v / Math.max(bn, 0.06)), 1.25);
    }

    // 2) suavizado espacial: elimina las mini-ondas entre puntos vecinos
    for (i = 0; i <= N_PTS; i++){
      var s = 0, c = 0;
      for (j = -4; j <= 4; j++){
        var k = i + j;
        if (k >= 0 && k <= N_PTS){ s += envRaw[k]; c++; }
      }
      bandV[i] = s / c;
    }

    // 3) forma final: ola lenta en los graves, rápida en los agudos,
    //    mezcladas gradualmente a lo largo de la línea
    for (i = 0; i <= N_PTS; i++){
      var d2 = i / N_PTS;
      var carrier = (1 - d2) * Math.sin(i * 0.22 + phase)
                  + d2 * Math.sin(i * 0.22 + phaseF);
      var edge = Math.min(1, Math.min(i, N_PTS - i) / 7);
      var target = bandV[i] * carrier * edge;
      // respuesta: graves amortiguados, agudos inmediatos
      ys[i] += (target - ys[i]) * (0.18 + d2 * 0.55);
    }
  }

  function strokeShape(alpha, width, scale, gradient){
    g.strokeStyle = gradient;
    g.globalAlpha = alpha;
    g.lineWidth = width;
    g.lineJoin = 'round';
    g.lineCap = 'round';
    g.beginPath();
    var midY = H / 2;
    var x0 = 0, y0 = midY + ys[0] * scale;
    g.moveTo(x0, y0);
    for (var i = 1; i <= N_PTS; i++){
      var x = (i / N_PTS) * W;
      var y = midY + ys[i] * scale;
      // curvas por punto medio: trazo continuo sin esquinas
      g.quadraticCurveTo(x0, y0, (x0 + x) / 2, (y0 + y) / 2);
      x0 = x; y0 = y;
    }
    g.lineTo(x0, y0);
    g.stroke();
    g.globalAlpha = 1;
  }

  function draw(){
    requestAnimationFrame(draw);
    var now = performance.now();
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    analyse();
    beatEnv *= Math.pow(0.03, dt);

    // olas viajeras: la lenta lleva los graves, la rápida los agudos
    phase  += dt * (1.1 + level * 1.6);
    phaseF += dt * (3.8 + level * 5.0);

    // amplitud general: sigue el volumen, cae suave al pausar
    var target = playing ? Math.min(1, level * 1.4 + bassSmooth * 0.9) : 0;
    amp += (target - amp) * (playing ? 0.45 : 0.06);

    g.fillStyle = '#050506';
    g.fillRect(0, 0, W, H);

    var midY = H / 2;
    var grad = '#F2EFEA';

    if (playing && freqData) updateShape();
    else for (var k = 0; k <= N_PTS; k++) ys[k] *= 0.92;   // pausa: se aquieta

    if (amp > 0.015){
      var scale = H * 0.21 * (0.10 + amp * 0.9) * (1 + beatEnv * 0.35);
      strokeShape(0.94, 3, scale, grad);
    } else {
      var idle = REDUCED ? 0 : Math.sin(now * 0.0012) * 1.2;
      g.strokeStyle = current >= 0 ? grad : '#2A2A30';
      g.globalAlpha = current >= 0 ? 0.5 : 1;
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(0, midY + idle);
      g.lineTo(W, midY + idle);
      g.stroke();
      g.globalAlpha = 1;
    }

    // tiempo y progreso
    if (audio && current >= 0){
      var t = scrubbing ? scrubTime : audio.currentTime;
      elTime.textContent = fmt(t) + ' / ' + fmt(audio.duration);
      var d = audio.duration;
      if (isFinite(d) && d > 0){
        var railW = W - 44;
        seekFill.style.width = Math.max(0, Math.min(1, t / d)) * railW + 'px';
      }
    }
  }
  requestAnimationFrame(draw);

  /* ============ interacción: tap = play/pausa, arrastrar = seek ============ */
  var pDown = false, pStartX = 0, pStartT = 0, dragged = false;

  cv.addEventListener('pointerdown', function(e){
    if (current < 0) { openPicker(); return; }
    pDown = true; dragged = false;
    pStartX = e.clientX;
    pStartT = audio.currentTime;
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', function(e){
    if (!pDown) return;
    var dx = e.clientX - pStartX;
    if (!dragged && Math.abs(dx) > 8){ dragged = true; scrubbing = true; }
    if (dragged){
      var d = audio && isFinite(audio.duration) ? audio.duration : Infinity;
      scrubTime = Math.max(0, Math.min(d, pStartT + dx / PX_PER_SEC * 5));
    }
  });
  cv.addEventListener('pointerup', function(){
    if (!pDown) return;
    pDown = false;
    if (dragged){ audio.currentTime = scrubTime; scrubbing = false; }
    else togglePlay();
  });
  cv.addEventListener('pointercancel', function(){ pDown = false; scrubbing = false; });

  // barra de progreso: tap o arrastre = posición directa
  var sDown = false;
  function seekFromX(x){
    if (!audio || !isFinite(audio.duration)) return;
    var frac = Math.max(0, Math.min(1, (x - 22) / (W - 44)));
    audio.currentTime = frac * audio.duration;
  }
  seekEl.addEventListener('pointerdown', function(e){
    sDown = true; seekEl.setPointerCapture(e.pointerId); seekFromX(e.clientX);
  });
  seekEl.addEventListener('pointermove', function(e){ if (sDown) seekFromX(e.clientX); });
  seekEl.addEventListener('pointerup', function(){ sDown = false; });
  seekEl.addEventListener('pointercancel', function(){ sDown = false; });

  function togglePlay(){
    if (!audio || current < 0) return;
    ensureGraph();
    if (audio.paused) audio.play().catch(function(){});
    else audio.pause();
  }

  /* ============ controles ============ */
  function openPicker(){ filePick.click(); }

  document.getElementById('btnAdd').addEventListener('click', openPicker);
  elEmpty.addEventListener('click', openPicker);
  filePick.addEventListener('change', function(){
    if (filePick.files && filePick.files.length) addFiles(filePick.files);
    filePick.value = '';
  });

  btnPlay.addEventListener('click', togglePlay);
  document.getElementById('btnPrev').addEventListener('click', function(){
    if (current < 0) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    if (current > 0) playTrack(current - 1); else audio.currentTime = 0;
  });
  document.getElementById('btnNext').addEventListener('click', function(){
    if (current < tracks.length - 1) playTrack(current + 1);
  });

  document.getElementById('btnSheet').addEventListener('click', function(){
    sheet.classList.add('open'); scrim.classList.add('open');
  });
  function closeSheet(){ sheet.classList.remove('open'); scrim.classList.remove('open'); }
  document.getElementById('btnCloseSheet').addEventListener('click', closeSheet);
  scrim.addEventListener('click', closeSheet);

  function renderList(){
    listEl.innerHTML = '';
    tracks.forEach(function(t, i){
      var li = document.createElement('li');
      if (i === current) li.className = 'current';
      var num = document.createElement('span');
      num.className = 'num'; num.textContent = i + 1;
      var nm = document.createElement('span');
      nm.className = 'tname'; nm.textContent = t.name;
      var du = document.createElement('span');
      du.className = 'tdur'; du.textContent = t.duration ? fmt(t.duration) : '···';
      li.appendChild(num); li.appendChild(nm); li.appendChild(du);
      li.addEventListener('click', function(){ playTrack(i); closeSheet(); });
      listEl.appendChild(li);
    });
  }

  /* ============ arrastrar y soltar (escritorio) ============ */
  document.addEventListener('dragover', function(e){ e.preventDefault(); });
  document.addEventListener('drop', function(e){
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  /* ============ media session ============ */
  if ('mediaSession' in navigator){
    try{
      navigator.mediaSession.setActionHandler('play',  function(){ if (audio) audio.play(); });
      navigator.mediaSession.setActionHandler('pause', function(){ if (audio) audio.pause(); });
      navigator.mediaSession.setActionHandler('previoustrack', function(){
        if (current > 0) playTrack(current - 1);
      });
      navigator.mediaSession.setActionHandler('nexttrack', function(){
        if (current < tracks.length - 1) playTrack(current + 1);
      });
    }catch(e){}
  }

  /* ============ teclado (escritorio) ============ */
  document.addEventListener('keydown', function(e){
    if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight' && audio) audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
    if (e.code === 'ArrowLeft'  && audio) audio.currentTime = Math.max(0, audio.currentTime - 5);
  });
})();
</script>
</body>
</html>
