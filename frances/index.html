<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Français — aprender francés</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Curso de francés con lecciones, conjugador, tarjetas y repaso espaciado.">
<meta name="theme-color" content="#FBFAF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* ==========================================================================
   Paleta. Se define completa en :root para el modo claro y se redefine
   entera bajo [data-theme="sombre"]. Nada de colores sueltos fuera de aquí.
   ========================================================================== */
:root{
  --bg:#FBFAF7;
  --surface:#FFFFFF;
  --surface2:#F4F2ED;
  --ink:#1A1A1C;
  --ink2:#55534E;
  --mut:#8C8981;
  --line:#E6E3DC;
  --accent:#2B4C8C;
  --accent-w:#E8EDF7;
  --ok:#1F7A46;
  --ok-w:#E4F3EA;
  --mal:#B23A34;
  --mal-w:#FBE9E7;
  --warn:#8A6212;
  --warn-w:#FBF2DC;
  --radius:14px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
}
[data-theme="sombre"]{
  --bg:#0E0E10;
  --surface:#17171A;
  --surface2:#1F1F23;
  --ink:#F0EEE9;
  --ink2:#B4B1AA;
  --mut:#7A776F;
  --line:#2A2A2F;
  --accent:#7BA0E0;
  --accent-w:#1A2438;
  --ok:#5EC98A;
  --ok-w:#14291D;
  --mal:#E8837C;
  --mal-w:#2E1A18;
  --warn:#D9B368;
  --warn-w:#2B2415;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));
}
#app{max-width:760px;margin:0 auto;padding:20px 18px 40px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}

/* ---------- tipografía ---------- */
h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;font-weight:700}
h2.sec{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);
  font-weight:600;margin:32px 0 12px;display:flex;align-items:center;gap:8px}
p{margin:0 0 14px}
.sub{color:var(--ink2);font-size:15px;margin:6px 0 0}
.mut{color:var(--mut);font-size:14px}
.lead{font-size:17px;color:var(--ink2);margin:14px 0 20px}
.intro{color:var(--ink2);font-size:15px;margin:-4px 0 14px}
.lien{color:var(--accent);font-size:14px;font-weight:500}
.lien:hover{text-decoration:underline}

.hd{margin:8px 0 24px}
.lecon-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}

/* ---------- chips y etiquetas ---------- */
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;
  padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--ink2);margin-right:6px}
.lv-A1{background:var(--ok-w);color:var(--ok)}
.lv-A2{background:var(--accent-w);color:var(--accent)}
.lv-B1{background:var(--warn-w);color:var(--warn)}
.lv-B2{background:var(--mal-w);color:var(--mal)}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;
  background:var(--accent);color:#fff;margin-left:auto}

/* ---------- tarjetas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.card b{display:block;font-size:16px;margin-bottom:4px}
.card span{display:block;color:var(--ink2);font-size:14.5px}
/* el chip vive dentro de un span de tarjeta y la regla de arriba lo estiraba
   a todo el ancho: se le devuelve su display propio */
.card .chip,.card .reg,.card .tag,.ligne .chip{display:inline-block;width:auto}
.card.note{background:var(--warn-w);border-color:transparent}
.card.note b{color:var(--warn)}
.card.danger b{color:var(--mal)}
.card.fin{text-align:center;padding:26px 18px}
.card.fin b{font-size:22px}

.card.action{display:flex;gap:14px;align-items:center;transition:transform .12s,border-color .12s}
.card.action:hover{transform:translateY(-1px);border-color:var(--accent)}
.card.action .ico{font-size:26px;flex:0 0 auto}
.card.action b{margin-bottom:2px}

/* ---------- cuadrícula de accesos ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tuile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;display:block;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tuile:hover{transform:translateY(-2px);border-color:var(--accent)}
.tuile .ico{font-size:24px;margin-bottom:8px}
.tuile b{display:block;font-size:15px}
.tuile span{display:block;color:var(--mut);font-size:13px;margin-top:2px}

/* ---------- tres números ---------- */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 10px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:700;line-height:1.1}
.stat span{display:block;font-size:12px;color:var(--mut);margin-top:3px}

/* ---------- barra de progreso ---------- */
.bar{height:7px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:8px 0;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

/* ---------- listas ---------- */
.liste{display:flex;flex-direction:column;gap:8px}
.ligne{display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;transition:border-color .12s}
.ligne:hover{border-color:var(--accent)}
.ligne.fait{opacity:.62}
.ligne .num{flex:0 0 30px;height:30px;border-radius:8px;background:var(--surface2);
  display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink2)}
.ligne .num.g1{background:var(--ok-w);color:var(--ok)}
.ligne .num.g2{background:var(--accent-w);color:var(--accent)}
.ligne .num.g3{background:var(--mal-w);color:var(--mal)}
.ligne div{flex:1;min-width:0}
.ligne b{display:block;font-size:15.5px;font-weight:600}
.ligne span{display:block;font-size:13.5px;color:var(--mut);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne .etat{flex:0 0 auto;color:var(--ok);font-weight:700;font-size:15px}

/* ---------- botones ---------- */
.btn{display:inline-block;background:var(--accent);color:#fff;padding:12px 20px;
  border-radius:10px;font-weight:600;font-size:15px;text-align:center;
  transition:opacity .12s;margin:4px 6px 4px 0}
.btn:hover{opacity:.88}
.btn.big{display:block;width:100%;padding:15px;font-size:16px;margin:16px 0 8px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.ok2{background:var(--ok)}
.btn.mal2{background:var(--mal)}
.cbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.cbtns .btn{flex:1;margin:0}

/* ---------- audio ---------- */
.say{font-size:15px;opacity:.42;padding:2px 6px;border-radius:6px;
  transition:opacity .12s,background .12s;vertical-align:middle;line-height:1}
.say:hover{opacity:1;background:var(--surface2)}

/* ---------- bloques de teoría ---------- */
.theorie{font-size:16.5px;line-height:1.72}
.theorie p{color:var(--ink2)}
.regle{background:var(--accent-w);border-left:3px solid var(--accent);
  border-radius:0 10px 10px 0;padding:14px 16px;margin:18px 0}
.regle p{margin:0;color:var(--ink);font-weight:500}
.regle .fr{margin-top:8px;font-size:16px;color:var(--accent);font-weight:600}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:11px 14px;margin:10px 0}
.ex .fr{font-size:17px;font-weight:600;color:var(--ink)}
.ex .es{font-size:14.5px;color:var(--mut);margin-top:2px}
.piege{background:var(--warn-w);border-radius:10px;padding:14px 16px;margin:18px 0}
.piege b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--warn);margin-bottom:5px}
.piege p{margin:0;color:var(--ink2);font-size:15.5px}
.son{background:var(--surface2);border-radius:10px;padding:14px 16px;margin:18px 0}
.son b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--mut);margin-bottom:5px}
.son .fr{font-size:17px;font-weight:600;margin-bottom:5px}
.son p{margin:0;font-size:15px;color:var(--ink2)}

/* ---------- tablas ---------- */
.tw{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--surface)}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);
  vertical-align:top;white-space:nowrap}
th{background:var(--surface2);font-size:12.5px;text-transform:uppercase;
  letter-spacing:.05em;color:var(--mut);font-weight:600}
tbody tr:last-child td{border-bottom:none}
td:first-child{font-weight:500}

/* ---------- quiz y ejercicios ---------- */
.quiz{max-width:560px;margin:0 auto}
.qtop{display:flex;justify-content:space-between;align-items:center;
  font-size:13px;color:var(--mut);margin-bottom:8px}
.qq{font-size:20px;font-weight:600;line-height:1.4;margin:18px 0 20px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:var(--surface);border:1.5px solid var(--line);border-radius:11px;
  padding:14px 16px;text-align:left;font-size:16px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.bon{border-color:var(--ok);background:var(--ok-w);font-weight:600}
.opt.faux{border-color:var(--mal);background:var(--mal-w)}

.exo{margin-top:8px}
.champs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.inp{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;
  padding:13px 15px;font-size:17px;flex:1;min-width:130px;outline:none;transition:border-color .12s}
.inp:focus{border-color:var(--accent)}
.inp:disabled{opacity:.75}
.inp.big{font-size:22px;padding:15px 18px;text-align:center}

.fb{margin-top:14px}
.fb:not(.on){display:none}
.fb b.ok{color:var(--ok);font-size:16px}
.fb b.mal{color:var(--mal);font-size:16px}
.fb b.presque{color:var(--warn);font-size:16px}
.sol{margin-top:6px;font-size:17px}
.sol b{color:var(--ink)}
.expl{margin-top:8px;font-size:14.5px;color:var(--ink2);line-height:1.55}

/* ---------- resultado del examen ---------- */
.resultat{text-align:center}
.niv{font-size:64px;font-weight:800;letter-spacing:-.03em;color:var(--accent);line-height:1}
.resultat .card{text-align:left}
.diag{display:flex;align-items:center;gap:12px;margin:9px 0;font-size:14px}
.diag>span:first-child{flex:0 0 108px;color:var(--ink2)}
.diag b{flex:0 0 48px;text-align:right;font-size:14px}

/* ---------- bienvenida ---------- */
.hero{text-align:center;padding:40px 6px}
.hero-ico{font-size:56px;margin-bottom:10px}
.hero h1{font-size:38px;margin-bottom:14px}
.hero p{color:var(--ink2);font-size:16.5px;max-width:480px;margin:0 auto 14px}

/* ---------- conjugación ---------- */
.conj{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden}
.cl{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line)}
.cl:last-child{border-bottom:none}
.cl .pr{flex:0 0 78px;color:var(--mut);font-size:13.5px}
.cl b{font-size:17px;font-weight:600;flex:0 0 auto;min-width:118px}
/* la glosa española: es la razón de ser de la fila, pero no debe competir
   con la forma francesa, así que va en cursiva y en tono menor */
.cl .gl{flex:1;font-style:normal;font-size:14.5px;color:var(--ink2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl.abre{cursor:pointer;transition:background .12s}
.cl.abre:hover{background:var(--surface2)}
.cl.abre:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cl .chev{flex:0 0 auto;color:var(--mut);font-size:17px;
  transition:transform .18s;display:inline-block}
.cl.on .chev{transform:rotate(90deg)}
.cl.on{background:var(--accent-w)}

/* ---------- oraciones desplegables ---------- */
.frases{background:var(--surface2);border-bottom:1px solid var(--line);
  padding:6px 15px 12px}
.fr1{padding:9px 0;border-bottom:1px solid var(--line)}
.fr1:last-child{border-bottom:none}
.ffr{font-size:15.5px;font-weight:600;line-height:1.45}
.fes{font-size:14px;color:var(--ink2);margin-top:2px;line-height:1.45}
.fnota{font-size:12.5px;color:var(--warn);margin-top:5px;line-height:1.45;
  padding-left:9px;border-left:2px solid var(--warn)}

/* ---------- notas de traducción ---------- */
.pista{font-size:13.5px;color:var(--mut);margin:-4px 0 4px;font-style:italic}
.notaT{font-size:13.5px;color:var(--ink2);background:var(--surface2);
  border-radius:9px;padding:10px 13px;margin:-4px 0 10px;line-height:1.5}
.notaP{font-size:12.5px;color:var(--mut);margin:7px 0 0;line-height:1.5}
.card.aviso{background:var(--mal-w);border-color:transparent}
.card.aviso b{color:var(--mal)}
.search{width:100%;background:var(--surface);border:1.5px solid var(--line);
  border-radius:11px;padding:13px 16px;font-size:16px;outline:none;margin-bottom:14px}
.search:focus{border-color:var(--accent)}

/* ---------- drill ---------- */
.drill{max-width:460px;margin:0 auto;text-align:center}
.dtop{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:20px}
.dverbe{font-size:26px;font-weight:700;margin-bottom:6px}
.dverbe .mut{font-size:16px;font-weight:400}
.dprompt{display:flex;align-items:center;gap:10px;justify-content:center;margin:22px 0 16px}
.dprompt .pr{color:var(--mut);font-size:16px;flex:0 0 auto}

/* ---------- tarjetas de vocabulario ---------- */
.carte{background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:44px 22px;text-align:center;box-shadow:var(--shadow);min-height:190px;
  display:flex;flex-direction:column;justify-content:center;gap:16px}
.cfr{font-size:32px;font-weight:700;letter-spacing:-.01em}
.ces b{display:block;font-size:21px;color:var(--accent)}
.ces .mut{display:block;font-size:14px;margin-top:4px}

/* ---------- memoria ---------- */
.mtop{display:flex;justify-content:space-between;font-size:14px;margin-bottom:14px}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mc{background:var(--surface);border:1.5px solid var(--line);border-radius:11px;
  padding:16px 10px;font-size:14.5px;min-height:62px;transition:all .15s;line-height:1.35}
.mc.fr{font-weight:600}
.mc.es{color:var(--ink2)}
.mc.on{border-color:var(--accent);background:var(--accent-w)}
.mc.trouvee{opacity:.32;border-color:var(--ok);background:var(--ok-w)}

/* ---------- expresiones ---------- */
.expr{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.efr{font-size:17px;font-weight:600}
.ees{font-size:14.5px;color:var(--ink2);margin-top:2px}
.enote{font-size:13px;color:var(--mut);margin-top:5px;font-style:italic}
.reg{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;margin-left:5px}
.r-fam{background:var(--mal-w);color:var(--mal)}
.r-cour{background:var(--ok-w);color:var(--ok)}
.r-form{background:var(--accent-w);color:var(--accent)}

/* ---------- recursos ---------- */
a.res{display:block;text-align:left}
a.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 17px;display:block;transition:border-color .12s,transform .12s}
a.res:hover{border-color:var(--accent);transform:translateY(-1px)}
a.res.reco{border-color:var(--accent)}
.rtop{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.rtop b{font-size:16px}
.rq{font-size:14.5px;color:var(--ink2);margin:0 0 6px}
.rp{font-size:14px;color:var(--mut);margin:0;line-height:1.5}

/* ---------- reproductor de escucha ---------- */
.player{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
.pcontrols{display:flex;align-items:center;justify-content:center;gap:24px}
.pbtn{font-size:26px;opacity:.72;transition:opacity .12s}
.pbtn:hover{opacity:1}
.pbtn.main{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:24px;opacity:1;display:grid;place-items:center}
.speed{display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:16px;font-size:13px;color:var(--mut)}
.sp{padding:5px 11px;border-radius:7px;font-size:13px;border:1px solid var(--line)}
.sp.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.script{display:flex;flex-direction:column;gap:2px}
.script .li{padding:9px 13px;border-radius:9px;margin:0;font-size:15.5px;
  color:var(--mut);cursor:pointer;transition:all .2s;line-height:1.55}
.script .li.fr{font-weight:600;color:var(--ink2)}
.script .li:hover{background:var(--surface2)}
.script .li.now{background:var(--accent-w);color:var(--ink);transform:scale(1.01)}
.script .li.now.fr{color:var(--accent)}

/* ---------- calendario ---------- */
.cal{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin:10px 0}
.cal i{aspect-ratio:1;border-radius:3px;background:var(--surface2);display:block}
.cal i.n1{background:var(--accent);opacity:.32}
.cal i.n2{background:var(--accent);opacity:.62}
.cal i.n3{background:var(--accent)}

/* ---------- ajustes ---------- */
.pref{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pref:last-child{border-bottom:none}
.pref>span:first-child{font-size:15px}
.seg{display:flex;gap:4px;background:var(--surface2);padding:3px;border-radius:9px}
.sg{padding:6px 12px;border-radius:7px;font-size:13.5px;color:var(--ink2)}
.sg.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.ta{width:100%;min-height:110px;background:var(--surface2);border:1px solid var(--line);
  border-radius:10px;padding:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11.5px;margin-top:10px;resize:vertical;outline:none}

/* ---------- navegación inferior ---------- */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:20;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);
  display:flex;justify-content:center;gap:2px;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nv{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 4px;border-radius:10px;color:var(--mut);transition:color .12s,background .12s}
.nv i{font-style:normal;font-size:19px;line-height:1}
.nv span{font-size:10.5px;font-weight:500}
.nv.on{color:var(--accent);background:var(--accent-w)}

/* ---------- pantallas anchas ---------- */
@media (min-width:820px){
  body{padding-bottom:0;padding-top:0}
  #app{padding:28px 24px 60px;max-width:820px}
  h1{font-size:34px}
  #nav{position:sticky;top:0;bottom:auto;justify-content:center;gap:4px;
    padding:8px 12px;border-top:none;border-bottom:1px solid var(--line)}
  .nv{flex-direction:row;gap:7px;max-width:none;padding:8px 14px}
  .nv span{font-size:13.5px}
  .nv i{font-size:15px}
  .mgrid{grid-template-columns:repeat(4,1fr)}
  .theorie{font-size:17px}
  .grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:560px){
